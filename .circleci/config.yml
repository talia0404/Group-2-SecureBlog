version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.8  # ✅ Node 22 LTS image
    steps:
      - checkout

      # --- Show project structure ---
      - run:
          name: Show repo structure
          command: |
            pwd
            ls -la
            echo "---- Backend dir ----"
            ls -la Backend || true

      # --- Restore & Install Dependencies (include dev) ---
      - restore_cache:
          keys:
            - node-deps-{{ checksum "Backend/package-lock.json" }}
            - node-deps-
      - run:
          name: Install Dependencies (include dev)
          command: cd Backend && npm ci --include=dev
      - save_cache:
          key: node-deps-{{ checksum "Backend/package-lock.json" }}
          paths:
            - ~/.npm

      # --- Verify Jest is Installed ---
      - run:
          name: Verify Jest Installation
          command: |
            cd Backend
            npx jest --version || echo "⚠️ Jest not found"

      # --- Run ESLint ---
      - run:
          name: Run ESLint
          command: cd Backend && npx eslint . --ext .js,.jsx,.ts,.tsx || true

      # --- Run Jest Tests (no config path issues) ---
      - run:
          name: Run Jest Tests
          command: |
            cd Backend
            echo "Running Jest from:" && pwd
            NODE_ENV=test npx jest --runInBand --ci --reporters=default

      # --- Docker Setup & Build ---
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker Image
          command: |
            cd Backend
            docker build -t secureblog-api .
            docker image ls

      # --- Optional: Check for HEALTHCHECK in Dockerfile ---
      - run:
          name: Verify HEALTHCHECK (optional)
          command: |
            cd Backend
            docker inspect secureblog-api --format='{{json .Config.Healthcheck}}' || echo "No HEALTHCHECK defined"

workflows:
  version: 2
  ci-pipeline:
    jobs:
      - build-and-test
