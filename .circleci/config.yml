version: 2.1

# 👇 Enables official CircleCI Node + Docker orbs
orbs:
  node: circleci/node@5.2.0
  docker: circleci/docker@2.4.0

jobs:
  # 🧹 Lint job
  lint:
    docker:
      - image: cimg/node:22.11  # ✅ Node 22 LTS
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run ESLint
          command: npm run lint

  # 🧪 Test job
  test:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run Unit Tests
          command: npm test

  # 🐳 Docker Build job
  docker_build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker Image
          command: |
            docker build -t secureblog:latest .
      - run:
          name: Health Check (optional)
          command: |
            echo "✅ Docker image built successfully!"

  # 🚀 Deploy to Render (after CI passes)
  deploy_render:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Trigger Render Deploy
          command: |
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"

workflows:
  version: 2
  build_test_deploy:
    jobs:
      - lint
      - test:
          requires:
            - lint
      - docker_build:
          requires:
            - test
      - deploy_render:
          requires:
            - docker_build
          filters:
            branches:
              only: main  # ✅ deploys only from main branch
