version: 2.1

executors:
  node_executor:
    docker:
      - image: cimg/node:22.0
    resource_class: medium

  base_docker:
    docker:
      - image: cimg/base:stable
    resource_class: medium

jobs:
  lint_and_test:
    executor: node_executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-npm-{{ arch }}-{{ checksum "package-lock.json" }}
            - v1-npm-{{ arch }}
            - v1-npm-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-npm-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Sanity check required env
          command: |
            test -n "$MONGO_URI" || { echo "MONGO_URI is NOT set"; exit 1; }
            test -n "$JWT_SECRET" || { echo "JWT_SECRET is NOT set"; exit 1; }
            echo "Env OK"

      - run:
          name: Run ESLint
          command: npm run lint

      - run:
          name: Run Jest
          command: npm test

  docker_build_and_healthcheck:
    executor: base_docker
    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Build Docker image
          command: |
            IMAGE_NAME="${IMAGE_NAME:-secureblog-backend}"
            docker build -t "$IMAGE_NAME:$CIRCLE_SHA1" .

      - run:
          name: Run container and wait for HEALTHY
          command: |
            IMAGE_NAME="${IMAGE_NAME:-secureblog-backend}"
            test -n "$MONGO_URI" || { echo "MONGO_URI is NOT set"; exit 1; }
            test -n "$JWT_SECRET" || { echo "JWT_SECRET is NOT set"; exit 1; }

            docker run -d --name secureblog \
              -e NODE_ENV=production \
              -e PORT=5000 \
              -e USE_HTTPS=false \
              -e MONGO_URI="$MONGO_URI" \
              -e JWT_SECRET="$JWT_SECRET" \
              "$IMAGE_NAME:$CIRCLE_SHA1"

            # wait up to ~120s for HEALTHCHECK=healthy
            for i in {1..60}; do
              STATUS="$(docker inspect --format='{{.State.Health.Status}}' secureblog 2>/dev/null || echo starting)"
              echo "Container health: $STATUS"
              [ "$STATUS" = "healthy" ] && echo "Healthy" && break
              sleep 2
            done

            [ "$(docker inspect --format='{{.State.Health.Status}}' secureblog 2>/dev/null || echo unhealthy)" = "healthy" ] || {
              echo "Container failed to become healthy"
              echo "---- Logs ----"
              docker logs --tail=200 secureblog || true
              exit 1
            }
      - run:
          name: Cleanup
          when: always
          command: docker rm -f secureblog || true

  deploy_to_render:
    docker:
      - image: cimg/node:22.0
    resource_class: medium
    environment:
      HEALTH_DELAY_SECS: "60"
      HEALTH_RETRY_SECS: "5"
      HEALTH_MAX_ATTEMPTS: "24"
      RENDER_HEALTH_PATH: "/health"
    steps:
      - run:
          name: Trigger Render deploy hook
          command: |
            test -n "$RENDER_DEPLOY_HOOK" || { echo "RENDER_DEPLOY_HOOK is NOT set"; exit 1; }
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
            echo "Deploy triggered."

      - run:
          name: Wait, then poll Render /health
          command: |
            test -n "$RENDER_SERVICE_URL" || { echo "RENDER_SERVICE_URL is NOT set"; exit 1; }
            BASE_URL="${RENDER_SERVICE_URL%/}"
            HEALTH_PATH="${RENDER_HEALTH_PATH:-/health}"
            HEALTH_URL="${BASE_URL}${HEALTH_PATH}"

            echo "Sleeping ${HEALTH_DELAY_SECS}s before health check..."
            sleep "${HEALTH_DELAY_SECS}"

            echo "Checking: ${HEALTH_URL}"
            ATTEMPTS=0
            until [ "$ATTEMPTS" -ge "$HEALTH_MAX_ATTEMPTS" ]; do
              HTTP_CODE="$(curl -L -sS -o /tmp/health_body.txt -w "%{http_code}" "$HEALTH_URL" || echo "000")"
              echo "Attempt $((ATTEMPTS+1))/$HEALTH_MAX_ATTEMPTS: $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ]; then
                echo "----- /health body -----"
                tail -c 1000 /tmp/health_body.txt || true
                echo
                echo "Health check PASSED"
                exit 0
              fi
              ATTEMPTS=$((ATTEMPTS+1))
              sleep "${HEALTH_RETRY_SECS}"
            done

            echo "Health check FAILED after $((HEALTH_MAX_ATTEMPTS*HEALTH_RETRY_SECS))s"
            echo "----- Last response body -----"
            tail -c 2000 /tmp/health_body.txt || true
            exit 1

workflows:
  secureblog:
    jobs:
      - lint_and_test
      - docker_build_and_healthcheck:
          requires:
            - lint_and_test
          filters:
            branches:
              only: main
      - deploy_to_render:
          requires:
            - lint_and_test
            - docker_build_and_healthcheck
          filters:
            branches:
              only: main