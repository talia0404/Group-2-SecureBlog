version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.8  # ✅ Node 22 LTS environment
    steps:
      - checkout

      # --- Restore cache for backend dependencies ---
      - restore_cache:
          keys:
            - node-deps-{{ checksum "backend/package-lock.json" }}
            - node-deps-

      # --- Install Dependencies ---
      - run:
          name: Install Dependencies
          command: cd backend && npm ci

      # --- Save cache ---
      - save_cache:
          key: node-deps-{{ checksum "backend/package-lock.json" }}
          paths:
            - ~/.npm

      # --- Lint Code ---
      - run:
          name: Run ESLint
          command: cd backend && npx eslint . --ext .js,.jsx,.ts,.tsx || true

      # --- Run Tests ---
      - run:
          name: Run Jest Tests
          command: cd backend && npm test -- --ci --reporters=default

      # --- Docker Setup ---
      - setup_remote_docker:
          docker_layer_caching: true

      # --- Build Docker Image ---
      - run:
          name: Build Docker Image
          command: |
            cd backend
            docker build -t secureblog-api .
            docker image ls

      # --- Health Check (optional but nice) ---
      - run:
          name: Verify Docker Container Health
          command: |
            cd backend
            docker run -d -p 5000:5000 --name secureblog-api-test secureblog-api
            echo "Waiting for container to start..."
            sleep 10
            curl -f http://localhost:5000/health || (echo "❌ Health check failed" && exit 1)
            docker stop secureblog-api-test

workflows:
  version: 2
  ci-pipeline:
    jobs:
      - build-and-test
