version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.8
    steps:
      - checkout

      - run:
          name: Show repo structure
          command: |
            pwd
            ls -la
            echo "---- Backend dir ----"
            ls -la Backend || true

      # Dependencies (include dev for jest/eslint)
      - restore_cache:
          keys:
            - node-deps-{{ checksum "Backend/package-lock.json" }}
            - node-deps-
      - run:
          name: Install Dependencies (include dev)
          command: cd Backend && npm ci --include=dev
      - save_cache:
          key: node-deps-{{ checksum "Backend/package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Run ESLint
          command: cd Backend && npx eslint . --ext .js,.jsx,.ts,.tsx || true

      - run:
          name: Run Jest Tests (pass if no tests yet)
          command: |
            cd Backend
            NODE_ENV=test npx jest --runInBand --ci --reporters=default --passWithNoTests

      # Build Docker image using Dockerfile.dev
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker Image (Dockerfile.dev)
          command: |
            cd Backend
            test -f Dockerfile.dev || (echo "Dockerfile.dev not found" && exit 1)
            docker build -f Dockerfile.dev -t secureblog-api .
            docker image ls

      # Optional: check HEALTHCHECK
      - run:
          name: Verify HEALTHCHECK (optional)
          command: |
            cd Backend
            docker inspect secureblog-api --format='{{json .Config.Healthcheck}}' || echo "No HEALTHCHECK defined"

workflows:
  version: 2
  ci-pipeline:
    jobs:
      - build-and-test
