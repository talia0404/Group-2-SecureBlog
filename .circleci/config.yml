version: 2.1


jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.8  # ✅ Node 22 LTS environment
    steps:
      - checkout


      # --- Restore cache for backend dependencies ---
      - restore_cache:
          keys:
            - node-deps-{{ checksum "Backend/package-lock.json" }}
            - node-deps-


      # --- Install Dependencies ---
      - run:
          name: Install Dependencies
          command: cd backend && npm ci


      # --- Save cache ---
      - save_cache:
          key: node-deps-{{ checksum "Backend/package-lock.json" }}
          paths:
            - ~/.npm


      # --- Lint Code ---
      - run:
          name: Run ESLint
          command: cd backend && npx eslint . --ext .js,.jsx,.ts,.tsx || true


      # --- Run Tests ---
      - run:
          name: Run Jest Tests
          command: cd backend && npm test -- --ci --reporters=default


      # --- Docker Setup ---
      - setup_remote_docker:
          docker_layer_caching: true


      # --- Build Docker Image ---
      - run:
          name: Build Docker Image
          command: |
            cd backend
            docker build -t secureblog-api .
            docker image ls


      
workflows:
  version: 2
  ci-pipeline:
    jobs:
      - build-and-test




